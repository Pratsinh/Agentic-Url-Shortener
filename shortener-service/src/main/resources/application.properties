# public base of short URLs; follows the server port unless set (e.g. SHORTENER_BASE_URL=https://sho.rt)
shortener.base-url=${SHORTENER_BASE_URL:http://localhost:${server.port:8080}}
# newest audit events kept in memory (older ones are evicted; sequence numbers expose the gap)
shortener.audit.capacity=10000

# every log line carries the request's correlation id (set by RequestIdFilter, echoed as X-Request-Id)
logging.pattern.level=%5p [%X{requestId:-}]
logging.level.com.ascs=INFO

# link storage: memory (default, needs no infrastructure) or cassandra (profile "cassandra": application-cassandra.properties)
shortener.storage=memory
# non-empty = Redis cache-aside in front of the store, e.g. redis://localhost:6379
shortener.cache.redis-url=
