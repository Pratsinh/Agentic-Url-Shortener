# Durable storage in Cassandra with a Redis cache. Start both with `docker compose up -d`, then
#   mvn spring-boot:run -Dspring-boot.run.profiles=cassandra
shortener.storage=cassandra
spring.cassandra.contact-points=${CASSANDRA_CONTACT_POINTS:localhost:9042}
spring.cassandra.local-datacenter=${CASSANDRA_DC:datacenter1}
spring.cassandra.connection.connect-timeout=10s
spring.cassandra.connection.init-query-timeout=10s
spring.cassandra.request.timeout=5s
shortener.cassandra.keyspace=shortener
shortener.cassandra.replication-factor=1
# dev convenience; production applies the CQL in CassandraSchema through its migration process
shortener.cassandra.create-schema=true

shortener.cache.redis-url=${REDIS_URL:redis://localhost:6379}
shortener.cache.command-timeout=200ms
